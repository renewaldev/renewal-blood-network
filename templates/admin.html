.chk input{width:16px;height:16px;accent-color:var(--blood-red)}
.btn.danger{color:var(--blood-red);border-color:#FDA4AF}
.btn-ghost.loading::before{border-color:rgba(0,0,0,.15);border-top-color:var(--blood-red)}
.row-sk{height:76px;margin-bottom:.5rem;border-radius:var(--radius-sm)}
.msg{padding:.6rem .8rem;border-radius:var(--radius-md);font-size:.9rem;margin:.6rem 0;animation:fadeIn .2s}
.err{background:#FFE4E6;color:var(--blood-dark)}
#progress{position:fixed;inset:0 0 auto;height:3px;z-index:10000;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--blood-red),transparent) no-repeat;background-size:40% 100%;animation:slide 1s linear infinite}
#progress.on{opacity:1}
dialog{border:1px solid var(--border);border-radius:var(--radius-xl);padding:0;width:min(420px,calc(100% - 2rem));background:#fff;color:var(--text-primary);box-shadow:var(--shadow-lg)}
dialog[open]{animation:pop .24s cubic-bezier(.2,.9,.3,1.2)}dialog.closing{animation:out .16s ease forwards}
dialog::backdrop{background:var(--bg-overlay);backdrop-filter:blur(6px);animation:fadeIn .2s}
.dlg-in{padding:var(--space-lg)}.dlg-in h3{margin-bottom:.4rem;font-size:1.2rem}.dlg-in p{margin-bottom:1rem}
.dlg-act{display:flex;gap:.5rem;justify-content:flex-end}
.toast.removing{animation:toastOut .3s ease forwards}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes out{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
:root{--header-height:calc(60px + env(safe-area-inset-top,0px))}
html{height:100%;overflow:hidden}
body{position:fixed;inset:0;width:100%;height:auto}
.admin-layout{height:auto!important;flex:1;min-height:0}
.admin-topbar{flex:none;height:var(--header-height);padding-top:env(safe-area-inset-top,0px);padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right))}
.sidebar-footer{padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
.sb-backdrop{display:none}
.admin-hamburger{width:44px;height:44px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;border-radius:12px;border:1px solid var(--admin-border);background:#fff;cursor:pointer}
.admin-hamburger span{display:block;width:20px;height:2px;border-radius:2px;background:var(--text-primary);transition:transform .25s,opacity .2s}
.admin-hamburger.is-open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.admin-hamburger.is-open span:nth-child(2){opacity:0}
.admin-hamburger.is-open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:768px){
.admin-topbar{display:flex!important}
.admin-topbar{position:relative;z-index:100}
.sb-backdrop{display:block;position:fixed;inset:var(--header-height) 0 0 0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:80;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.sb-backdrop.open{opacity:1;visibility:visible}
.admin-sidebar{width:82%;max-width:300px;z-index:90}
.sidebar-header{padding:1rem}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="progress"></div>
  <div class="admin-topbar">
    <div class="topbar-brand" id="top-brand">RENEWAL ADMIN</div>
    <button type="button" class="admin-hamburger" id="menu-btn" aria-label="মেনু খুলুন" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>

  <div class="sb-backdrop" id="sb-backdrop"></div>

  <!-- লগইন -->
  <section id="login-view" class="login-overlay" hidden>
    <div class="login-card">
      <div class="login-ico"><i class="fas fa-user-shield"></i></div>
      <h3>অ্যাডমিন প্যানেল</h3>
      <p class="sub">সিস্টেমে প্রবেশ করতে ইউজারনেম ও পাসওয়ার্ড দিন</p>
      <form id="login-form">
        <div class="form-group"><input id="a-user" class="form-control" type="text" autocomplete="username" maxlength="64" placeholder="ইউজারনেম / ইমেইল" required></div>
        <div class="form-group"><input id="a-pass" class="form-control login-pwd" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
        <div id="cap-admin"></div>
        <button type="submit" class="btn btn-primary btn-full"><i class="fas fa-lock-open"></i> প্রবেশ করুন</button>
      </form>
      <div id="login-msg"></div>
    </div>
  </section>

  <!-- পাসওয়ার্ড বদল (প্রথম লগইনে বাধ্যতামূলক) -->
  <section id="pw-view" class="login-overlay" hidden>
    <div class="login-card">
      <div class="login-ico"><i class="fas fa-key"></i></div>
      <h3>পাসওয়ার্ড বদলান</h3>
      <p class="sub" id="pw-sub"></p>
      <form id="pw-form">
        <div class="form-group"><input id="pw-cur" class="form-control" type="password" autocomplete="current-password" maxlength="256" placeholder="বর্তমান পাসওয়ার্ড" required></div>
        <div class="form-group"><input id="pw-new" class="form-control" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="নতুন পাসওয়ার্ড" required></div>
        <div class="form-group"><input id="pw-new2" class="form-control" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="নতুন পাসওয়ার্ড আবার" required></div>
        <button type="submit" class="btn btn-primary btn-full"><i class="fas fa-floppy-disk"></i> সংরক্ষণ</button>
        <button type="button" id="pw-cancel" class="btn btn-ghost btn-full" hidden>বাতিল</button>
        <button type="button" id="pw-logout" class="btn btn-ghost btn-full" hidden>লগআউট</button>
      </form>
      <div id="pw-msg"></div>
    </div>
  </section>

  <!-- মূল লেআউট -->
  <div id="app" class="admin-layout" hidden>
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
        <h2>RENEWAL ADMIN</h2>
        <div class="muted">কন্ট্রোল প্যানেল</div>
      </div>
      <nav class="sidebar-nav" id="tabs"></nav>
      <div class="sidebar-footer">
        <div id="who"></div>
        <button id="pw-btn" type="button" class="sidebar-link" hidden><i class="fas fa-key"></i> পাসওয়ার্ড বদলান</button>
        <button id="logout-btn" type="button" class="sidebar-link" hidden><i class="fas fa-right-from-bracket"></i> লগআউট</button>
      </div>
    </aside>
    <main class="admin-main" id="content">
      <div class="admin-section">
        <div class="admin-section-header"><i id="title-ico" class="fas fa-list"></i><span id="title"></span></div>
        <div class="admin-section-content">
          <div id="filters" class="filter-row"></div>
          <div id="list"></div>
          <div id="pager" class="pager"></div>
        </div>
      </div>
    </main>
  </div>

  <dialog id="dlg"><div class="dlg-in"><h3 id="dlg-title"></h3><p class="muted" id="dlg-text"></p><div class="dlg-act" id="dlg-act"></div></div></dialog>
  <div id="toasts" class="toast-container" aria-live="polite"></div>

  <script nonce="{{ nonce }}" src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script nonce="{{ nonce }}">
  (() => {
    'use strict';

    const $ = id => document.getElementById(id);
    const PAGE = 50;
    const BLOOD = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
    const REQ_STATUSES = ['pending', 'verified', 'rejected', 'fulfilled', 'expired'];
    const REQ_NEXT = { pending: ['verified', 'rejected'], verified: ['fulfilled', 'rejected'] };
    const CONTACT_STATUSES = ['pending', 'contacted', 'done', 'rejected'];
    const ANY = [['', 'সব']];

    let config = { turnstileEnabled: false, turnstileSiteKey: '' };
    let csrf = null;
    let adminPhone = null;
    let me = null;          // { username, role }
    let pwForced = false;   // প্রথম লগইনের বাধ্যতামূলক পাসওয়ার্ড বদল
    const capToken = {};
    const capWidget = {};
    const state = { tab: 'pending', offset: 0 };

    // ───── DOM helpers ─────
    function el(tag, props = {}, kids = []) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'text') n.textContent = v;
        else if (k === 'class') n.className = v;
        else n.setAttribute(k, v);
      }
      if (tag === 'button') n.classList.add('btn', (props.type === 'submit' || n.classList.contains('primary')) ? 'btn-primary' : 'btn-ghost');
      for (const c of kids) n.append(c);
      return n;
    }
    function note(target, text, ok = false) {
      target.replaceChildren(el('div', { class: 'msg ' + (ok ? 'ok' : 'err'), text }));
    }
    function flash(text, ok = true) {
      const t = el('div', { class: 'toast ' + (ok ? 'success' : 'error') }, [
        el('i', { class: 'fas toast-icon ' + (ok ? 'fa-circle-check' : 'fa-circle-xmark') }),
        el('div', { class: 'toast-content' }, [el('div', { class: 'toast-msg', text })]),
      ]);
      $('toasts').append(t);
      setTimeout(() => { t.classList.add('removing'); setTimeout(() => t.remove(), 300); }, 3500);
    }
    function input(type = 'text', attrs = {}) {
      return el('input', { type, autocomplete: 'off', class: type === 'checkbox' ? '' : 'form-control', ...attrs });
    }
    function selectEl(options, value = '') {
      const s = el('select', { class: 'form-control' });
      for (const [v, t] of options) s.append(el('option', { value: v, text: t }));
      s.value = value;
      return s;
    }
    function lab(text, control) {
      return el('div', { class: 'form-group' }, [el('label', { class: 'form-label', text }), control]);
    }
    function fmt(iso) {
      return iso ? new Date(iso).toLocaleString() : '';
    }

    // ───── মোবাইল সাইডবার ─────
    function setNav(open) {
      $('sidebar').classList.toggle('open', open);
      $('sb-backdrop').classList.toggle('open', open);
      $('menu-btn').classList.toggle('is-open', open);
      $('menu-btn').setAttribute('aria-expanded', String(open));
    }

    // ───── ডায়ালগ ও লোডিং ─────
    const dlg = $('dlg');
    function closeDialog() {
      if (!dlg.open || dlg.classList.contains('closing')) return;
      dlg.classList.add('closing');
      setTimeout(() => { dlg.close(); dlg.classList.remove('closing'); }, 160);
    }
    dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); });
    function confirmDialog(title, text, label) {
      return new Promise(resolve => {
        let done = false;
        const fin = v => { if (done) return; done = true; closeDialog(); resolve(v); };
        const ok = el('button', { type: 'button', class: 'primary', text: label });
        const no = el('button', { type: 'button', text: 'বাতিল' });
        ok.addEventListener('click', () => fin(true));
        no.addEventListener('click', () => fin(false));
        dlg.addEventListener('close', () => fin(false), { once: true });
        $('dlg-title').textContent = title;
        $('dlg-text').textContent = text;
        $('dlg-act').replaceChildren(no, ok);
        dlg.classList.remove('closing');
        if (!dlg.open) dlg.showModal();
      });
    }
    let actor = null, pending = 0, barTimer = 0;
    function busy(d) {
      pending += d;
      clearTimeout(barTimer);
      if (pending > 0) barTimer = setTimeout(() => $('progress').classList.add('on'), 120);
      else $('progress').classList.remove('on');
    }
    document.addEventListener('click', e => { actor = e.target.closest ? e.target.closest('button') : null; }, true);
    document.addEventListener('submit', e => { actor = e.submitter || e.target.querySelector('button[type=submit]'); }, true);

    // ───── API: CSRF হেডার; csrf_failed হলে রিফ্রেশ ও একবার পুনঃচেষ্টা; 401 হলে লগইন ─────
    async function api(path, opts = {}, retry = true) {
      const btn = actor;
      actor = null;
      if (btn && btn.classList.contains('btn')) btn.classList.add('loading'); else if (btn) btn.classList.add('loading');
      busy(1);
      try { return await rawApi(path, opts, retry); }
      finally { busy(-1); if (btn) btn.classList.remove('loading'); }
    }
    async function rawApi(path, opts = {}, retry = true) {
      const method = opts.method || 'GET';
      const headers = {};
      if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
      if (method !== 'GET' && csrf) headers['X-CSRF-Token'] = csrf;
      const res = await fetch(path, {
        method,
        headers,
        credentials: 'same-origin',
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
      });
      let data = {};
      try { data = await res.json(); } catch (_) { /* খালি উত্তর */ }
      if (!res.ok) {
        const e = data.error || {};
        if (e.code === 'csrf_failed' && retry && csrf) {
          await checkSession();
          return rawApi(path, opts, false);
        }
        const err = new Error(e.message || 'সমস্যা হয়েছে');
        err.code = res.status === 401 ? 'unauthorized' : e.code;
        if (e.code === 'password_change_required') showPw(true);
        throw err;
      }
      return data;
    }

    // ───── Turnstile ─────
    function mountCaptcha(name) {
      if (!config.turnstileEnabled) return;
      const tryRender = (n = 0) => {
        const box = $('cap-' + name);
        if (box && window.turnstile) {
          capWidget[name] = window.turnstile.render(box, {
            sitekey: config.turnstileSiteKey,
            callback: t => { capToken[name] = t; },
            'expired-callback': () => { capToken[name] = null; },
            'error-callback': () => { capToken[name] = null; },
          });
        } else if (n < 50) {
          setTimeout(() => tryRender(n + 1), 200);
        }
      };
      tryRender();
    }
    function captchaToken(name) {
      if (!config.turnstileEnabled) return undefined;
      const t = capToken[name];
      if (!t) throw new Error('বট যাচাই সম্পন্ন করুন');
      capToken[name] = null;
      if (window.turnstile && capWidget[name] !== undefined) window.turnstile.reset(capWidget[name]);
      return t;
    }

    // ───── সেশন ও ভিউ ─────
    function showLogin(msg) {
      csrf = null;
      adminPhone = null;
      me = null;
      pwForced = false;
      $('pw-view').hidden = true;
      $('pw-btn').hidden = true;
      setNav(false);
      $('menu-btn').hidden = true;
      $('top-brand').textContent = 'RENEWAL ADMIN';
      $('who').textContent = '';
      $('logout-btn').hidden = true;
      $('app').hidden = true;
      $('login-view').hidden = false;
      $('login-msg').replaceChildren();
      if (msg) note($('login-msg'), msg);
      mountCaptcha('admin');
    }

    function showApp() {
      $('login-view').hidden = true;
      $('menu-btn').hidden = false;
      $('app').hidden = false;
      $('logout-btn').hidden = false;
      $('pw-view').hidden = true;
      $('pw-btn').hidden = false;
      $('who').textContent = me ? me.username + (me.role === 'superadmin' ? ' (সুপার অ্যাডমিন)' : '') : 'অ্যাডমিন';
      renderTabs();
      renderTab();
    }

    async function checkSession() {
      try {
        const d = await api('/admin/api/me', {}, false);
        csrf = d.csrfToken;
        me = { username: d.username, role: d.role };
        pwForced = !!d.mustChangePassword;
        return true;
      } catch (e) {
        // প্রথমবার লগইন না থাকা স্বাভাবিক — কোনো বার্তা দেখাই না
        showLogin(e.code === 'unauthorized' ? undefined : e.message);
        return false;
      }
    }

    // ───── পাসওয়ার্ড বদল ─────
    function showPw(forced) {
      pwForced = forced;
      $('login-view').hidden = true;
      if (forced) { $('app').hidden = true; $('menu-btn').hidden = true; }
      $('pw-view').hidden = false;
      $('pw-cancel').hidden = forced;
      $('pw-logout').hidden = !forced;
      $('pw-sub').textContent = forced
        ? 'প্রথম লগইন — চালিয়ে যেতে নতুন পাসওয়ার্ড দিন (কমপক্ষে ১০ অক্ষর)'
        : 'নতুন পাসওয়ার্ড দিন (কমপক্ষে ১০ অক্ষর)';
      $('pw-msg').replaceChildren();
      for (const id of ['pw-cur', 'pw-new', 'pw-new2']) $(id).value = '';
    }

    async function onPwChange(e) {
      e.preventDefault();
      const msg = $('pw-msg');
      msg.replaceChildren();
      const cur = $('pw-cur').value, nw = $('pw-new').value, nw2 = $('pw-new2').value;
      if (nw !== nw2) return note(msg, 'নতুন পাসওয়ার্ড দুটি মেলেনি');
      if (nw.length < 10) return note(msg, 'নতুন পাসওয়ার্ড কমপক্ষে ১০ অক্ষরের হতে হবে');
      try {
        await api('/admin/api/change-password', { method: 'POST', body: { currentPassword: cur, newPassword: nw } });
        for (const id of ['pw-cur', 'pw-new', 'pw-new2']) $(id).value = '';
        const wasForced = pwForced;
        pwForced = false;
        $('pw-view').hidden = true;
        flash('পাসওয়ার্ড বদলানো হয়েছে', true);
        if (wasForced) showApp();
      } catch (err) {
        if (err.code === 'unauthorized') showLogin('সেশন শেষ হয়েছে, আবার লগইন করুন');
        else note(msg, err.message);
      }
    }

    // ───── ট্যাব ও ফিল্টার ─────
    const TABS = {
      pending: {
        title: 'যাচাই বাকি', path: '/admin/api/requests', fixed: { status: 'pending' },
        filters: [], row: renderRequest,
      },
      requests: {
        title: 'জরুরি অনুরোধ', path: '/admin/api/requests', fixed: {},
        filters: [{ key: 'status', label: 'স্ট্যাটাস', type: 'select', options: ANY.concat(REQ_STATUSES.map(s => [s, s])) }],
        row: renderRequest,
      },
      contacts: {
        title: 'যোগাযোগ অনুরোধ', path: '/admin/api/contacts', fixed: {},
        filters: [{ key: 'status', label: 'স্ট্যাটাস', type: 'select', options: ANY.concat(CONTACT_STATUSES.map(s => [s, s])) }],
        row: renderContact,
      },
      reports: {
        title: 'রিপোর্ট', path: '/admin/api/reports', fixed: {},
        filters: [{ key: 'target_type', label: 'ধরন', type: 'select', options: [['', 'সব'], ['donor', 'দাতা'], ['request', 'অনুরোধ']] }],
        row: renderReport,
      },
      donors: {
        title: 'দাতা', path: '/admin/api/donors', fixed: {},
        filters: [
          { key: 'suspicious', label: 'সন্দেহজনক', type: 'select', options: [['', 'সব'], ['true', 'শুধু সন্দেহজনক']] },
          { key: 'district', label: 'জেলা', type: 'text' },
          { key: 'q', label: 'নাম / ফোন', type: 'text' },
          { key: 'donor_id', label: 'দাতার আইডি', type: 'text' },
        ],
        row: renderDonor,
      },
      users: {
        title: 'ব্যবহারকারী', path: '/admin/api/users', fixed: {},
        filters: [{ key: 'flagged', label: 'ফ্ল্যাগ', type: 'select', options: [['', 'সব'], ['true', 'শুধু ফ্ল্যাগ করা']] }],
        row: renderUser,
      },
      reveals: {
        title: 'নম্বর দেখার লগ', path: '/admin/api/reveals', fixed: {},
        filters: [
          { key: 'user_id', label: 'ইউজার আইডি', type: 'text' },
          { key: 'target_id', label: 'লক্ষ্য আইডি', type: 'text' },
        ],
        row: renderReveal,
      },
      audit: {
        title: 'Audit log', path: '/admin/api/audit', fixed: {},
        filters: [], row: renderAudit,
      },
      admins: {
        title: 'অ্যাডমিনস', path: '/admin/api/admins', fixed: {}, superOnly: true,
        filters: [], row: renderAdmin, toolbar: adminToolbar,
      },
    };

    const ICON = { pending: 'fa-hourglass-half', requests: 'fa-triangle-exclamation', contacts: 'fa-phone', reports: 'fa-flag', donors: 'fa-users', users: 'fa-user-gear', reveals: 'fa-eye', audit: 'fa-clipboard-list', admins: 'fa-user-shield' };
    function renderTabs() {
      const nav = $('tabs');
      nav.replaceChildren();
      for (const [key, def] of Object.entries(TABS)) {
        if (def.superOnly && (!me || me.role !== 'superadmin')) continue;
        const b = el('button', { type: 'button', class: 'sidebar-link' + (key === state.tab ? ' active' : ''), 'data-tab': key }, [el('i', { class: 'fas ' + ICON[key] }), def.title]);
        b.addEventListener('click', () => {
          state.tab = key;
          state.offset = 0;
          setNav(false);
          renderTabs();
          renderTab();
        });
        nav.append(b);
      }
    }

    function renderTab() {
      const def = TABS[state.tab];
      $('title').textContent = def.title;
      $('top-brand').textContent = def.title;
      $('title-ico').className = 'fas ' + ICON[state.tab];
      const bar = $('filters');
      bar.replaceChildren();
      if (def.filters.length) {
        for (const f of def.filters) {
          const ctl = f.type === 'select' ? selectEl(f.options) : input('text', { maxlength: '64' });
          ctl.dataset.key = f.key;
          bar.append(lab(f.label, ctl));
        }
        const go = el('button', { type: 'button', class: 'primary', text: 'খুঁজুন' });
        go.addEventListener('click', () => { state.offset = 0; load(); });
        bar.append(go);
      }
      if (def.toolbar) bar.append(...def.toolbar());
      const refresh = el('button', { type: 'button', text: 'রিফ্রেশ' });
      refresh.addEventListener('click', () => load());
      bar.append(refresh);
      if (state.prefill) {  // অন্য ট্যাব থেকে "দাতা দেখুন" দিয়ে এলে ফিল্টার আগে থেকে বসানো
        for (const ctl of bar.querySelectorAll('[data-key]')) {
          if (state.prefill[ctl.dataset.key] !== undefined) ctl.value = state.prefill[ctl.dataset.key];
        }
        state.prefill = null;
      }
      load();
    }

    function queryParams() {
      const def = TABS[state.tab];
      const p = { limit: String(PAGE), offset: String(state.offset), ...def.fixed };
      for (const ctl of $('filters').querySelectorAll('[data-key]')) {
        if (ctl.value) p[ctl.dataset.key] = ctl.value;
      }
      return p;
    }

    async function load() {
      const def = TABS[state.tab];
      const list = $('list');
      list.replaceChildren();
      for (let i = 0; i < 4; i++) list.append(el('div', { class: 'skeleton row-sk' }));
      $('pager').replaceChildren();
      try {
        const data = await api(def.path + '?' + new URLSearchParams(queryParams()).toString());
        if (!data.items.length && state.offset === 0) list.replaceChildren(el('div', { class: 'empty-state', text: 'কিছু পাওয়া যায়নি' }));
        if (data.items.length) list.replaceChildren(...data.items.map(def.row));
        renderPager(data.items.length);
      } catch (e) {
        if (e.code === 'unauthorized') showLogin('সেশন শেষ হয়েছে, আবার লগইন করুন');
        else note(list, e.message);
      }
    }

    function renderPager(count) {
      const bar = $('pager');
      bar.replaceChildren();
      const prev = el('button', { type: 'button', text: 'আগের পাতা' });
      prev.disabled = state.offset === 0;
      prev.addEventListener('click', () => { state.offset = Math.max(0, state.offset - PAGE); load(); });
      const next = el('button', { type: 'button', text: 'পরের পাতা' });
      next.disabled = count < PAGE;
      next.addEventListener('click', () => { state.offset += PAGE; load(); });
      bar.append(prev, next);
    }

    // একটি অ্যাকশন চালিয়ে সফল হলে তালিকা রিফ্রেশ
    async function act(btn, fn, okText) {
      btn.disabled = true;
      try {
        await fn();
        flash(okText, true);
        load();
      } catch (e) {
        if (e.code === 'unauthorized') showLogin('সেশন শেষ হয়েছে, আবার লগইন করুন');
        else flash(e.message, false);
        btn.disabled = false;
      }
    }

    // ───── রো রেন্ডারার ─────
    const ST = { pending: 'status-pending', verified: 'status-verified', rejected: 'status-rejected', fulfilled: 'status-completed', expired: 'status-expired', contacted: 'status-review', done: 'status-completed', active: 'status-verified', blocked: 'status-rejected' };
    const badge = (t, cls) => el('span', { class: 'status-badge ' + (cls || ST[t] || ''), text: t });
    const h4 = (t, bs = []) => el('h4', {}, [t, ...bs]);
    const p = t => el('p', { text: t });
    const chk = (t, ctl) => el('label', { class: 'chk' }, [ctl, t]);
    function item(info, actions = []) {
      return el('div', { class: 'data-item' }, [el('div', { class: 'data-info' }, info), el('div', { class: 'data-actions' }, actions)]);
    }
    const unauth = e => { if (e.code === 'unauthorized') { showLogin('সেশন শেষ হয়েছে, আবার লগইন করুন'); return true; } return false; };

    function renderRequest(r) {
      const noteIn = input('text', { maxlength: '500', placeholder: 'নোট (ঐচ্ছিক)' });
      const nexts = REQ_NEXT[r.status] || [];
      const acts = nexts.length ? [noteIn] : [];
      for (const next of nexts) {
        const b = el('button', { type: 'button', class: next === 'rejected' ? 'danger' : '', text: `→ ${next}` });
        b.addEventListener('click', async () => {
          if (next === 'rejected' && !(await confirmDialog('অনুরোধ বাতিল', 'এই অনুরোধটি rejected করতে চান?', 'বাতিল করুন'))) return;
          act(b, () => api(`/admin/api/requests/${encodeURIComponent(r.id)}`, {
            method: 'PUT', body: { status: next, note: noteIn.value.trim() || null },
          }), 'অনুরোধ আপডেট হয়েছে');
        });
        acts.push(b);
      }
      return item([
        h4(`${r.bloodGroup} · ${r.units} ইউনিট · ${r.hospital}`, [badge(r.status)]),
        p(`${r.patientName} · ${r.district}${r.upazila ? ' · ' + r.upazila : ''} · প্রয়োজন: ${fmt(r.neededAt)}`),
        p(`স্বজন: ${r.attendantName} · ${r.contact} · জমা: ${fmt(r.submittedAt)} · রিপোর্ট: ${r.reportCount}`),
        r.reason ? p(r.reason) : el('span'),
      ], acts);
    }

    // দাতার আইডি ধরে দাতা ট্যাবে গিয়ে সেই দাতাকেই দেখায়
    function jumpToDonor(donorId) {
      const b = el('button', { type: 'button', text: 'দাতা দেখুন' });
      b.addEventListener('click', () => {
        state.tab = 'donors';
        state.offset = 0;
        state.prefill = { donor_id: donorId };
        setNav(false);
        renderTabs();
        renderTab();
      });
      return b;
    }

    function renderContact(c) {
      const sel = selectEl(CONTACT_STATUSES.map(s => [s, s]), c.status);
      const btn = el('button', { type: 'button', class: 'primary', text: 'সংরক্ষণ' });
      btn.addEventListener('click', () => act(btn, () => api(`/admin/api/contacts/${encodeURIComponent(c.id)}`, {
        method: 'PUT', body: { status: sel.value },
      }), 'স্ট্যাটাস আপডেট হয়েছে'));
      return item([
        h4(`${c.patient} · ${c.blood_group} · ${c.units} ইউনিট`, [badge(c.status)]),
        p(`${c.hospital} · রোগীর পক্ষের ফোন: ${c.phone} · ${fmt(c.submitted_at)}`),
        p(`দাতা: ${c.donor_name} · ${c.donor_phone} · ${c.donor_district}, ${c.donor_upazila} · আইডি: ${c.donor_id}`),
      ], [jumpToDonor(c.donor_id), sel, btn]);
    }

    function renderReport(r) {
      return item([
        h4(`${r.target_type === 'donor' ? 'দাতা' : 'অনুরোধ'} · ${r.target_id}`),
        p(r.reason || '(কারণ লেখা হয়নি)'),
        p(fmt(r.created_at)),
      ], r.target_type === 'donor' ? [jumpToDonor(r.target_id)] : []);
    }

    function renderDonor(d) {
      const lvl = selectEl([0, 1, 2, 3, 4].map(n => [String(n), `স্তর ${n}`]), String(d.verification_level));
      const sus = input('checkbox', d.suspicious ? { checked: 'checked' } : {});
      const can = input('checkbox', d.can_donate ? { checked: 'checked' } : {});
      const btn = el('button', { type: 'button', class: 'primary', text: 'সংরক্ষণ' });
      btn.addEventListener('click', () => act(btn, () => api(`/admin/api/donors/${encodeURIComponent(d.id)}`, {
        method: 'PUT',
        body: { verificationLevel: Number(lvl.value), suspicious: sus.checked, canDonate: can.checked },
      }), 'দাতার তথ্য আপডেট হয়েছে'));
      // রক্তদান নথিভুক্ত (গণনা, শেষ দান ও trust score বাড়ায়)
      const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const donDate = input('date', { value: today, max: today });
      const donPlace = input('text', { maxlength: '160', placeholder: 'স্থান (ঐচ্ছিক)' });
      const donBtn = el('button', { type: 'button', text: 'দান নথিভুক্ত' });
      donBtn.addEventListener('click', async () => {
        if (!donDate.value) { flash('দানের তারিখ দিন', false); return; }
        if (!(await confirmDialog('রক্তদান নথিভুক্ত', `${d.name}-এর ${donDate.value} তারিখের দান যোগ করতে চান?`, 'নথিভুক্ত করুন'))) return;
        act(donBtn, () => api(`/admin/api/donors/${encodeURIComponent(d.id)}/donations`, {
          method: 'POST',
          body: { donatedAt: donDate.value, place: donPlace.value.trim() || null },
        }), 'রক্তদান নথিভুক্ত হয়েছে');
      });
      return item([
        h4(`${d.name} (${d.blood_group})`, d.suspicious ? [badge('সন্দেহজনক', 'status-rejected')] : []),
        p(`ফোন: ${d.phone} · ${d.district} · ${d.upazila} · রিপোর্ট ${d.report_count} · দান ${d.donation_count} · স্কোর ${d.trust_score} · ${d.badge || ''} · আইডি: ${d.id}`),
      ], [lvl, chk('সন্দেহজনক', sus), chk('রক্ত দিতে প্রস্তুত', can), btn, donDate, donPlace, donBtn]);
    }

    function renderUser(u) {
      const blocked = u.status === 'blocked';
      const toggle = el('button', { type: 'button', class: blocked ? '' : 'danger', text: blocked ? 'আনব্লক' : 'ব্লক করুন' });
      toggle.addEventListener('click', async () => {
        if (!blocked && !(await confirmDialog('ব্যবহারকারী ব্লক', 'এই ব্যবহারকারীকে ব্লক করতে চান?', 'ব্লক করুন'))) return;
        act(toggle, () => api(`/admin/api/users/${encodeURIComponent(u.id)}`, {
          method: 'PUT', body: { status: blocked ? 'active' : 'blocked' },
        }), blocked ? 'আনব্লক হয়েছে' : 'ব্লক করা হয়েছে');
      });
      const acts = [toggle];
      if (u.flagged) {
        const clear = el('button', { type: 'button', text: 'ফ্ল্যাগ সাফ' });
        clear.addEventListener('click', () => act(clear, () => api(`/admin/api/users/${encodeURIComponent(u.id)}`, {
          method: 'PUT', body: { flagged: false },
        }), 'ফ্ল্যাগ সাফ হয়েছে'));
        acts.push(clear);
      }
      return item([
        h4(u.phone || u.email || u.id, [badge(u.status)].concat(u.flagged ? [badge('ফ্ল্যাগ করা', 'status-rejected')] : [])),
        p(`তৈরি: ${fmt(u.created_at)} · শেষ লগইন: ${fmt(u.last_login_at) || '—'}`),
      ], acts);
    }

    function renderReveal(r) {
      return item(
        [p(`${fmt(r.created_at)} · ইউজার ${r.user_id} → ${r.target_type} ${r.target_id}`)],
        r.target_type === 'donor' ? [jumpToDonor(r.target_id)] : [],
      );
    }

    function renderAudit(a) {
      const detail = a.detail ? JSON.stringify(a.detail, null, 2) : '';
      return item([
        h4(a.action),
        p(`${a.target_type || ''} ${a.target_id || ''} · ${fmt(a.created_at)}`),
        detail ? el('pre', { text: detail }) : el('span'),
      ]);
    }

    function adminToolbar() {
      const u = input('text', { maxlength: '64', placeholder: 'ইউজারনেম বা ইমেইল' });
      const b = el('button', { type: 'button', class: 'primary', text: 'অ্যাডমিন যোগ করুন' });
      b.addEventListener('click', async () => {
        await act(b, async () => {
          await api('/admin/api/admins', { method: 'POST', body: { username: u.value } });
          u.value = '';
        }, 'নতুন অ্যাডমিন তৈরি হয়েছে');
        b.disabled = false;
      });
      return [
        lab('নতুন অ্যাডমিন', u),
        b,
        el('p', { class: 'muted', text: 'অস্থায়ী পাসওয়ার্ড সার্ভারের .env-এর ADMIN_TEMP_PASSWORD; প্রথম লগইনে বদলাতে হবে।' }),
      ];
    }

    function renderAdmin(a) {
      const isSuper = a.role === 'superadmin';
      const acts = [];
      if (!isSuper) {
        const del = el('button', { type: 'button', class: 'danger', text: 'ডিলিট' });
        del.addEventListener('click', async () => {
          if (!(await confirmDialog('অ্যাডমিন ডিলিট', `"${a.username}" কে ডিলিট করতে চান? তার সব সেশন সাথে সাথে বাতিল হবে।`, 'ডিলিট'))) return;
          act(del, () => api(`/admin/api/admins/${encodeURIComponent(a.id)}`, { method: 'DELETE' }), 'অ্যাডমিন ডিলিট হয়েছে');
        });
        acts.push(del);
      }
      const badges = [badge(isSuper ? 'সুপার অ্যাডমিন' : 'অ্যাডমিন', isSuper ? 'status-verified' : 'status-review')];
      if (a.must_change_password) badges.push(badge('পাসওয়ার্ড বদলায়নি', 'status-pending'));
      return item([
        h4(a.username, badges),
        p(`তৈরি: ${fmt(a.created_at)}${a.created_by ? ' · তৈরি করেছেন: ' + a.created_by : ''} · শেষ লগইন: ${fmt(a.last_login_at) || '—'}`),
      ], acts);
    }

    // ───── লগইন / লগআউট ─────
    async function onLogin(e) {
      e.preventDefault();
      const msg = $('login-msg');
      msg.replaceChildren();
      try {
        const d = await api('/admin/api/login', {
          method: 'POST',
          body: { username: $('a-user').value, password: $('a-pass').value, turnstileToken: captchaToken('admin') },
        });
        csrf = d.csrfToken;
        me = { username: d.username, role: d.role };
        $('a-pass').value = '';
        if (d.mustChangePassword) showPw(true); else showApp();
      } catch (err) {
        note(msg, err.message);
        mountCaptcha('admin');
      }
    }

    async function onLogout() {
      if (!(await confirmDialog('লগআউট', 'আপনি কি লগআউট করতে চান?', 'লগআউট'))) return;
      try { await api('/admin/api/logout', { method: 'POST' }); } catch (_) { /* ignore */ }
      showLogin();
    }

    async function init() {
      try { config = await api('/api/config', {}, false); } catch (_) { /* ডিফল্ট */ }
      $('login-form').addEventListener('submit', onLogin);
      $('logout-btn').addEventListener('click', onLogout);
      $('pw-logout').addEventListener('click', onLogout);
      $('pw-form').addEventListener('submit', onPwChange);
      $('pw-btn').addEventListener('click', () => showPw(false));
      $('pw-cancel').addEventListener('click', () => { $('pw-view').hidden = true; });
      $('menu-btn').addEventListener('click', () => setNav(!$('sidebar').classList.contains('open')));
      $('sb-backdrop').addEventListener('click', () => setNav(false));
      addEventListener('keydown', e => { if (e.key === 'Escape') setNav(false); });
      if (await checkSession()) { if (pwForced) showPw(true); else showApp(); }
    }

    init();
  })();
  </script>
</body>
</html>
